<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
  </defs>
  <rect width="1200" height="760" fill="#ffffff"/>

  <!-- Title -->
  <text x="40" y="44" font-size="22" font-weight="700" fill="#0f172a">AWS architecture after migration</text>
  <text x="40" y="68" font-size="13" fill="#64748b">Spring Boot on EC2 talks to a private Amazon RDS for PostgreSQL instance. The database has no public route.</text>

  <!-- Users -->
  <g>
    <circle cx="80" cy="300" r="14" fill="#475569"/>
    <path d="M56,342 a24,22 0 0 1 48,0 z" fill="#475569"/>
    <text x="80" y="370" font-size="13" font-weight="600" text-anchor="middle" fill="#0f172a">Customers</text>
    <text x="80" y="388" font-size="11" text-anchor="middle" fill="#64748b">Angular storefront</text>
    <text x="80" y="402" font-size="11" text-anchor="middle" fill="#64748b">in the browser</text>
  </g>

  <!-- AWS Cloud -->
  <rect x="150" y="96" width="1020" height="630" rx="6" fill="none" stroke="#232f3e" stroke-width="2"/>
  <rect x="150" y="96" width="92" height="26" fill="#232f3e"/>
  <text x="196" y="114" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">AWS Cloud</text>

  <!-- Region -->
  <rect x="172" y="136" width="976" height="570" rx="4" fill="none" stroke="#00a4a6" stroke-width="1.6" stroke-dasharray="7 5"/>
  <text x="186" y="158" font-size="13" font-weight="600" fill="#007d7f">Region: ap-south-1 (Mumbai)</text>

  <!-- VPC -->
  <rect x="236" y="174" width="700" height="512" rx="4" fill="#fbfdff" stroke="#8c4fff" stroke-width="1.8"/>
  <rect x="236" y="174" width="46" height="26" fill="#8c4fff"/>
  <text x="259" y="192" font-size="12" font-weight="700" text-anchor="middle" fill="#fff">VPC</text>

  <!-- Internet gateway -->
  <rect x="216" y="282" width="40" height="40" rx="6" fill="#8c4fff"/>
  <path d="M226,302 h20 M240,294 l8,8 l-8,8" stroke="#fff" stroke-width="2.4" fill="none"/>
  <text x="236" y="340" font-size="11" text-anchor="middle" fill="#5b21b6">Internet</text>
  <text x="236" y="353" font-size="11" text-anchor="middle" fill="#5b21b6">gateway</text>
  <line x1="112" y1="302" x2="212" y2="302" stroke="#334155" stroke-width="1.8" marker-end="url(#a)"/>
  <text x="150" y="288" font-size="11" text-anchor="middle" fill="#334155">HTTPS</text>

  <!-- AZ a -->
  <rect x="300" y="214" width="300" height="456" rx="4" fill="none" stroke="#147eba" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="312" y="234" font-size="12" font-weight="600" fill="#147eba">Availability Zone A</text>
  <!-- AZ b -->
  <rect x="620" y="214" width="300" height="456" rx="4" fill="none" stroke="#147eba" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="632" y="234" font-size="12" font-weight="600" fill="#147eba">Availability Zone B</text>

  <!-- Public subnet A -->
  <rect x="314" y="246" width="272" height="196" rx="4" fill="#f2f8ec" stroke="#7aa116" stroke-width="1.4"/>
  <text x="326" y="266" font-size="12" font-weight="600" fill="#4d6b0f">Public subnet</text>

  <!-- EC2 host -->
  <rect x="330" y="276" width="240" height="160" rx="6" fill="#ffffff" stroke="#ed7100" stroke-width="1.6"/>
  <rect x="340" y="286" width="30" height="30" rx="4" fill="#ed7100"/>
  <rect x="347" y="293" width="16" height="16" fill="none" stroke="#fff" stroke-width="2"/>
  <text x="378" y="299" font-size="13" font-weight="700" fill="#0f172a">Amazon EC2</text>
  <text x="378" y="313" font-size="11" fill="#64748b">Docker host · app-sg</text>
  <rect x="340" y="324" width="220" height="50" rx="4" fill="#fff7ed" stroke="#fdba74"/>
  <text x="350" y="342" font-size="11.5" font-weight="600" fill="#9a3412">Spring Boot containers</text>
  <text x="350" y="358" font-size="10.5" fill="#9a3412">auth · products · pricing · orders</text>
  <text x="350" y="370" font-size="10.5" fill="#9a3412">inventory · reports</text>
  <rect x="340" y="382" width="220" height="44" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="5 4"/>
  <text x="350" y="400" font-size="11.5" font-weight="600" fill="#475569">Old PostgreSQL container</text>
  <text x="350" y="416" font-size="10.5" fill="#64748b">stopped, volume kept for rollback</text>

  <line x1="258" y1="302" x2="326" y2="320" stroke="#334155" stroke-width="1.8" marker-end="url(#a)"/>

  <!-- Private subnet A -->
  <rect x="314" y="460" width="272" height="196" rx="4" fill="#e6f2f8" stroke="#147eba" stroke-width="1.4"/>
  <text x="326" y="480" font-size="12" font-weight="600" fill="#0b5e8c">Private subnet (DB)</text>

  <!-- RDS primary -->
  <rect x="334" y="494" width="232" height="146" rx="6" fill="#ffffff" stroke="#2e27ad" stroke-width="1.6"/>
  <rect x="346" y="506" width="34" height="34" rx="4" fill="#2e27ad"/>
  <ellipse cx="363" cy="515" rx="10" ry="4" fill="none" stroke="#fff" stroke-width="2"/>
  <path d="M353,515 v14 a10,4 0 0 0 20,0 v-14" fill="none" stroke="#fff" stroke-width="2"/>
  <text x="390" y="520" font-size="13" font-weight="700" fill="#0f172a">Amazon RDS</text>
  <text x="390" y="536" font-size="11" fill="#64748b">PostgreSQL · primary</text>
  <text x="346" y="562" font-size="11" fill="#334155">publicly accessible: No</text>
  <text x="346" y="578" font-size="11" fill="#334155">encrypted at rest · TLS enforced</text>
  <text x="346" y="594" font-size="11" fill="#334155">deletion protection · gp3</text>
  <rect x="346" y="606" width="208" height="24" rx="12" fill="#eef2ff" stroke="#a5b4fc"/>
  <text x="450" y="622" font-size="11" text-anchor="middle" fill="#3730a3">rds-sg: 5432 from app-sg only</text>

  <!-- app -> rds -->
  <line x1="470" y1="438" x2="470" y2="490" stroke="#15803d" stroke-width="2.2" marker-end="url(#ag)"/>
  <text x="478" y="460" font-size="11" fill="#15803d">JDBC over TLS</text>
  <text x="478" y="474" font-size="11" fill="#15803d">HikariCP · Flyway</text>

  <!-- AZ B note -->
  <text x="770" y="330" font-size="11.5" text-anchor="middle" fill="#64748b">A second AZ is required by the</text>
  <text x="770" y="346" font-size="11.5" text-anchor="middle" fill="#64748b">RDS DB subnet group, and is where</text>
  <text x="770" y="362" font-size="11.5" text-anchor="middle" fill="#64748b">a Multi-AZ standby would run.</text>

  <!-- one-time migration arrow -->
  <path d="M340,404 C300,440 300,520 330,556" fill="none" stroke="#b45309" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#ao)"/>

  <!-- Private subnet B -->
  <rect x="634" y="460" width="272" height="196" rx="4" fill="#e6f2f8" stroke="#147eba" stroke-width="1.4"/>
  <text x="646" y="480" font-size="12" font-weight="600" fill="#0b5e8c">Private subnet (DB)</text>
  <rect x="654" y="494" width="232" height="146" rx="6" fill="#ffffff" stroke="#2e27ad" stroke-width="1.4" stroke-dasharray="6 4"/>
  <rect x="666" y="506" width="34" height="34" rx="4" fill="#a5b4fc"/>
  <ellipse cx="683" cy="515" rx="10" ry="4" fill="none" stroke="#fff" stroke-width="2"/>
  <path d="M673,515 v14 a10,4 0 0 0 20,0 v-14" fill="none" stroke="#fff" stroke-width="2"/>
  <text x="710" y="520" font-size="13" font-weight="700" fill="#475569">RDS standby</text>
  <text x="710" y="536" font-size="11" fill="#64748b">optional · Multi-AZ</text>
  <text x="666" y="566" font-size="11" fill="#334155">Not enabled at launch.</text>
  <text x="666" y="582" font-size="11" fill="#334155">Turn on when downtime</text>
  <text x="666" y="598" font-size="11" fill="#334155">costs more than the standby.</text>
  <line x1="568" y1="566" x2="650" y2="566" stroke="#64748b" stroke-width="1.4" stroke-dasharray="4 4" marker-end="url(#a)"/>
  <text x="609" y="558" font-size="10" text-anchor="middle" fill="#64748b">sync</text>

  <!-- DB subnet group label -->
  <text x="610" y="682" font-size="11" text-anchor="middle" fill="#0b5e8c">DB subnet group spans both private subnets</text>

  <!-- Regional managed services column -->
  <text x="958" y="200" font-size="12" font-weight="600" fill="#007d7f">Regional services</text>

  <rect x="958" y="214" width="174" height="96" rx="6" fill="#ffffff" stroke="#3f8624" stroke-width="1.5"/>
  <rect x="970" y="226" width="30" height="30" rx="4" fill="#3f8624"/>
  <path d="M977,236 h16 l-2,14 h-12 z" fill="none" stroke="#fff" stroke-width="2"/>
  <text x="1008" y="246" font-size="12.5" font-weight="700" fill="#0f172a">Automated</text>
  <text x="1008" y="261" font-size="12.5" font-weight="700" fill="#0f172a">backups</text>
  <text x="970" y="282" font-size="11" fill="#334155">daily snapshots + PITR</text>
  <text x="970" y="297" font-size="11" fill="#64748b">stored by AWS in S3</text>

  <rect x="958" y="326" width="174" height="96" rx="6" fill="#ffffff" stroke="#e7157b" stroke-width="1.5"/>
  <rect x="970" y="338" width="30" height="30" rx="4" fill="#e7157b"/>
  <path d="M975,360 l6,-8 l5,5 l8,-10" fill="none" stroke="#fff" stroke-width="2"/>
  <text x="1008" y="358" font-size="12.5" font-weight="700" fill="#0f172a">CloudWatch</text>
  <text x="970" y="390" font-size="11" fill="#334155">CPU, connections,</text>
  <text x="970" y="405" font-size="11" fill="#334155">free storage alarms</text>

  <rect x="958" y="438" width="174" height="96" rx="6" fill="#ffffff" stroke="#dd344c" stroke-width="1.5"/>
  <rect x="970" y="450" width="30" height="30" rx="4" fill="#dd344c"/>
  <rect x="978" y="462" width="14" height="11" rx="2" fill="none" stroke="#fff" stroke-width="2"/>
  <path d="M981,462 v-4 a4,4 0 0 1 8,0 v4" fill="none" stroke="#fff" stroke-width="2"/>
  <text x="1008" y="463" font-size="12.5" font-weight="700" fill="#0f172a">IAM + KMS</text>
  <text x="970" y="502" font-size="11" fill="#334155">least-privilege access,</text>
  <text x="970" y="517" font-size="11" fill="#334155">storage encryption key</text>

  <line x1="936" y1="262" x2="954" y2="262" stroke="#64748b" stroke-width="1.2" marker-end="url(#a)"/>
  <line x1="936" y1="374" x2="954" y2="374" stroke="#64748b" stroke-width="1.2" marker-end="url(#a)"/>
  <line x1="936" y1="486" x2="954" y2="486" stroke="#64748b" stroke-width="1.2" marker-end="url(#a)"/>

  <!-- Legend -->
  <g font-size="11" fill="#334155">
    <line x1="958" y1="566" x2="990" y2="566" stroke="#15803d" stroke-width="2.2"/><text x="998" y="570">app traffic</text>
    <line x1="958" y1="590" x2="990" y2="590" stroke="#b45309" stroke-width="1.8" stroke-dasharray="6 4"/><text x="998" y="594">pg_dump → pg_restore</text>
    <line x1="958" y1="614" x2="990" y2="614" stroke="#64748b" stroke-width="1.4" stroke-dasharray="4 4"/><text x="998" y="618">optional / managed</text>
  </g>
</svg>
