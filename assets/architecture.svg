<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="960" height="470" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker>
  </defs>

  <!-- BEFORE -->
  <text x="40" y="40" font-size="20" font-weight="700" fill="#0f172a">Before</text>
  <text x="40" y="62" font-size="13" fill="#64748b">App and database share one EC2 box</text>
  <rect x="40" y="80" width="400" height="350" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="58" y="106" font-size="13" font-weight="600" fill="#334155">EC2 instance</text>

  <rect x="62" y="122" width="356" height="110" rx="8" fill="#eef2ff" stroke="#a5b4fc"/>
  <text x="80" y="146" font-size="13" font-weight="600" fill="#3730a3">Docker: Spring Boot microservices</text>
  <text x="80" y="170" font-size="12" fill="#4338ca">auth · products · pricing · orders</text>
  <text x="80" y="190" font-size="12" fill="#4338ca">inventory · reports</text>
  <text x="80" y="214" font-size="11" fill="#6366f1">Angular storefront calls these APIs</text>

  <line x1="240" y1="232" x2="240" y2="268" stroke="#475569" stroke-width="1.6" marker-end="url(#arr)"/>

  <rect x="62" y="272" width="356" height="92" rx="8" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="80" y="296" font-size="13" font-weight="600" fill="#991b1b">Docker: PostgreSQL container</text>
  <text x="80" y="318" font-size="12" fill="#b91c1c">data on the instance's own volume</text>
  <text x="80" y="338" font-size="12" fill="#b91c1c">backups, patching, recovery: all manual</text>

  <text x="62" y="396" font-size="12" fill="#991b1b">⚠  One instance failure takes the app and the data down together</text>

  <!-- arrow between -->
  <line x1="458" y1="255" x2="502" y2="255" stroke="#15803d" stroke-width="2.5" marker-end="url(#arrg)"/>

  <!-- AFTER -->
  <text x="520" y="40" font-size="20" font-weight="700" fill="#0f172a">After</text>
  <text x="520" y="62" font-size="13" fill="#64748b">Database moved to managed Amazon RDS, kept private</text>
  <rect x="520" y="80" width="400" height="350" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="538" y="106" font-size="13" font-weight="600" fill="#334155">VPC</text>

  <rect x="542" y="122" width="356" height="92" rx="8" fill="#eef2ff" stroke="#a5b4fc"/>
  <text x="560" y="146" font-size="13" font-weight="600" fill="#3730a3">EC2: Spring Boot microservices</text>
  <text x="560" y="168" font-size="12" fill="#4338ca">security group: app-sg</text>
  <text x="560" y="188" font-size="12" fill="#4338ca">DB URL + credentials from env, not code</text>

  <line x1="720" y1="214" x2="720" y2="256" stroke="#475569" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="730" y="240" font-size="11" fill="#475569">5432, only from app-sg</text>

  <rect x="542" y="260" width="356" height="112" rx="8" fill="#f0fdf4" stroke="#86efac"/>
  <text x="560" y="284" font-size="13" font-weight="600" fill="#166534">Amazon RDS for PostgreSQL</text>
  <text x="560" y="306" font-size="12" fill="#15803d">private subnets · not publicly accessible</text>
  <text x="560" y="326" font-size="12" fill="#15803d">encrypted storage · automated backups + PITR</text>
  <text x="560" y="346" font-size="12" fill="#15803d">deletion protection · gp3 storage</text>

  <text x="542" y="398" font-size="12" fill="#166534">✓  Old container kept stopped, untouched, as the rollback path</text>
</svg>
